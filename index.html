<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Quotex Style — Live Signal V6</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="account"><span class="cap">◆</span><b class="demo">LIVE DATA</b><strong>$9,782.45</strong><span>⌄</span></div>
    <div class="bell">♧</div>
    <button class="deposit">Deposit</button>
  </header>

  <div class="bonus">🚀 Get a <b>50% bonus</b> on your deposit! <strong>50%</strong><span>×</span></div>

  <main>
    <section class="chartCard">
      <div class="chartTop">
        <button class="dots">•••</button>
        <div class="clock" id="clock">--:--:--</div>
        <div class="info">i</div>
        <div class="provider" id="provider">CONNECTING…</div>
      </div>
      <div class="chartWrap">
        <canvas id="chart"></canvas>
        <div class="priceLine" id="priceLine"></div>
        <div class="countdown" id="candleCountdown">--:--</div>
        <div class="watermark">QUOTEX<br><small>STYLE</small></div>
      </div>

      <div class="chartControls">
        <div class="assets" id="assets">
          <button data-symbol="EURUSD" class="active">🇪🇺🇺🇸 <b>EUR/USD</b></button>
          <button data-symbol="GBPUSD">🇬🇧🇺🇸 GBP/USD</button>
          <button data-symbol="USDJPY">🇺🇸🇯🇵 USD/JPY</button>
          <button data-symbol="XAUUSD">🟡 XAU/USD</button>
          <button data-symbol="BTCUSD">₿ BTC/USD</button>
        </div>
        <div class="frames">
          <button data-tf="60" class="active">1m</button>
          <button data-tf="300">5m</button>
          <button data-tf="900">15m</button>
          <button data-tf="1800">30m</button>
          <button data-tf="3600">1h</button>
          <button data-tf="14400">4h</button>
          <button data-tf="86400">1d</button>
        </div>
      </div>
    </section>

    <section class="trade">
      <div class="assetRow">
        <div class="assetName"><span id="assetFlag">🇪🇺🇺🇸</span><b id="assetLabel">EUR/USD</b><em id="score">—</em> <span class="chev">⌄</span></div>
        <div class="pending">PENDING TRADE <i></i></div>
      </div>

      <div class="fields">
        <div class="field"><label>Timer</label><strong id="expiry">00:01</strong></div>
        <div class="field investment"><label>Investment</label><span class="minus">−</span><strong>1 %</strong><span class="plus">+</span></div>
      </div>
      <div class="switch">SWITCH</div>
      <div class="payout"><span>Payout</span><b id="payout">$173.14</b></div>
      <div class="investmentLine"><span>Investment</span><b>$97.82</b></div>

      <div class="signalBox">
        <div><span>AI SIGNAL</span><strong id="signal">WAIT</strong></div>
        <small id="signalReason">Waiting for live candles…</small>
      </div>

      <div class="buttons">
        <button class="buy" id="buy">Buy <span>↑</span></button>
        <button class="sell" id="sell">Sell <span>↓</span></button>
      </div>
    </section>
  </main>

  <nav class="bottom">
    <span class="selected">▣</span><span>?</span><span>♟</span><span>🏆</span><span>•••</span>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
